
name: FleetSync CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ====================================
  # React Web
  # ====================================
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React web
        run: npm run build:web

      - name: Run ESLint
        run: npm run lint --workspace=apps/web

  # ====================================
  # Expo React Native
  # ====================================
  mobile:
    name: mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check:mobile

  # ====================================
  # ASP.NET Core API
  # ====================================

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore apps/api/FleetSync.slnx

      - name: Build API solution
        run: dotnet build apps/api/FleetSync.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test apps/api/tests/FleetSync.UnitTests/FleetSync.UnitTests.csproj --configuration Release --no-build


  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fleetsync_ci
          POSTGRES_USER: fleetsync
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetsync -d fleetsync_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__FleetSyncDatabase: "Host=127.0.0.1;Port=5432;Database=fleetsync_ci;Username=fleetsync;Password=ci-only-password"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore apps/api/FleetSync.slnx

      - name: Build API solution
        run: dotnet build apps/api/FleetSync.slnx --configuration Release --no-restore

      - name: Run PostgreSQL integration tests
        run: dotnet test apps/api/tests/FleetSync.IntegrationTests/FleetSync.IntegrationTests.csproj --configuration Release --no-build

      - name: Restore EF Core CLI tools
        run: dotnet tool restore

      - name: Check for missing EF Core migrations
        run: dotnet ef migrations has-pending-model-changes --project apps/api/src/FleetSync.Infrastructure --startup-project apps/api/src/FleetSync.Api --context FleetSyncDbContext

