
name: FleetSync CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ====================================
  # React Web
  # ====================================
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React web
        run: npm run build:web

      - name: Run ESLint
        run: npm run lint --workspace=apps/web

  # ====================================
  # Expo React Native
  # ====================================
  mobile:
    name: mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check:mobile

  # ====================================
  # ASP.NET Core API
  # ====================================
  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore apps/api/FleetSync.slnx

      - name: Build API
        run: dotnet build apps/api/FleetSync.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test apps/api/FleetSync.slnx --configuration Release --no-build
